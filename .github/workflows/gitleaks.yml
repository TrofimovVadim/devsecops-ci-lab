name: Secret Scanning

on: [push]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
    
       
     - name: Скачиваем код
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
       
       
     - name: Запускаем Gitleaks
       run: |
         docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" -v
