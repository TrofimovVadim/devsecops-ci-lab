name: Secret Scanning

on: [push]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
    
       
     - name: Скачиваем код
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
       
       
     - name: Запускаем Gitleaks
       uses: gitleaks/gitleaks-action@v2
       env:
         GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
