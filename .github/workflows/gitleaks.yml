name: Secret Scanning

on: [push]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
    
       
     - name: Скачиваем код
       uses: actions/checkout@v4

       with:
         fetch-depth: 1
       
       
     - name: Запускаем Gitleaks
       run: |
         docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source="/path" -v

  semgrep-scan:
      runs-on: ubuntu-latest
      steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config auto --error config.py
      
    
